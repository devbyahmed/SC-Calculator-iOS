# XcodeGen spec. On your Mac run:  brew install xcodegen && xcodegen
# This generates Numo.xcodeproj (it is not committed; regenerate any time).
name: Numo

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Numo:
    type: application
    platform: iOS
    sources:
      - path: Numo
    info:
      path: Numo/Info.plist
      properties:
        CFBundleDisplayName: SC Calculator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: SC Calculator uses Face ID to protect your private space.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # CHANGE THIS to something unique to you, e.g. com.yourname.numo
        PRODUCT_BUNDLE_IDENTIFIER: com.example.numo
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Leave empty here; pick your (free) Personal Team in Xcode > Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Notes AppIcon-Weather AppIcon-Compass"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        ENABLE_PREVIEWS: YES
    scheme: {}
